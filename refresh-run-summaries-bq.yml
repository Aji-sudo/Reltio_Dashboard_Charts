name: Refresh Reltio dashboard audit data

on:
  schedule:
    # Refresh approximately every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BigQuery dependency
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery

      - name: Fetch audit data from BigQuery
        env:
          # Store the COMPLETE service-account JSON as a GitHub
          # repository secret named GCP_SERVICE_ACCOUNT_JSON.
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

          # Optional. If omitted, project_id from the JSON is used.
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

          # These are the defaults in the production ingestion script.
          BQ_AUDIT_DATASET: prime_test
          BQ_AUDIT_TABLE: audit_log

          # Number of runs exposed to the dashboard.
          MAX_RUNS: "20"

        run: python fetch_run_summaries.py

      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/run-summaries.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update dashboard audit data [skip ci]"
            git push
          fi
