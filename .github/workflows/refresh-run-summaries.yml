name: Refresh Reltio run summaries

on:
  schedule:
    # Runs every 15 minutes. GitHub Actions cron can lag a few minutes
    # under load -- treat this as "approximately every 15 min", not exact.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Lets you trigger this manually from the Actions tab for testing,
    # without waiting for the schedule.

permissions:
  contents: write   # needed so the workflow can commit the updated JSON

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch RunSummary entities from Reltio
        env:
          RELTIO_ENVIRONMENT: ${{ secrets.RELTIO_ENVIRONMENT }}
          RELTIO_TENANT_ID: ${{ secrets.RELTIO_TENANT_ID }}
          RELTIO_CLIENT_ID: ${{ secrets.RELTIO_CLIENT_ID }}
          RELTIO_CLIENT_SECRET: ${{ secrets.RELTIO_CLIENT_SECRET }}
        run: python fetch_run_summaries.py

      - name: Commit updated data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/run-summaries.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update run-summaries.json [skip ci]"
          git push
