name: Refresh Reltio run summaries

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery

      - name: Fetch audit data from BigQuery
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BQ_AUDIT_DATASET: prime_test
          BQ_AUDIT_TABLE: audit_log
          MAX_RUNS: "20"
        run: python fetch_run_summaries_bq.py

      - name: Commit updated data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/run-summaries.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update run-summaries.json [skip ci]"
            git push
          fi
